#cloud-config
# Dedicated production host for the MyInvest Support Platform (Ubuntu 24.04 LTS).
#
# Rendered by `scripts/provision-host.sh user-data`, which replaces
# __SSH_PUBLIC_KEY__ with the operator's public key. Pass the rendered file to
# the cloud provider as user data (Hetzner: `--user-data-from-file`).
#
# The host ends up with: Docker Engine + Compose v2, GnuPG, rclone, an
# unprivileged `deploy` user in the docker group, key-only SSH, ufw limited to
# 22/80/443, unattended security upgrades, and 2 GiB of swap so the Chatwoot
# image build does not OOM on an 8 GiB machine. The application itself is
# shipped afterwards by `scripts/provision-host.sh install`.

package_update: true
package_upgrade: true
package_reboot_if_required: false

packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - jq
  - rclone
  - ufw
  - unattended-upgrades

users:
  - name: deploy
    groups: [docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - __SSH_PUBLIC_KEY__

# Docker's own apt repository: Ubuntu's docker.io lags and ships no Compose v2.
apt:
  sources:
    docker:
      source: "deb [arch=amd64 signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable"
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
      keyserver: https://download.docker.com/linux/ubuntu/gpg

write_files:
  - path: /etc/ssh/sshd_config.d/90-myinvest-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
      MaxAuthTries 4
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "50m", "max-file": "5" },
        "live-restore": true
      }
  - path: /etc/apt/apt.conf.d/52myinvest-unattended
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Automatic-Reboot "false";

swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

runcmd:
  - [apt-get, install, -y, docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
  - [systemctl, enable, --now, docker]
  - [install, -d, -m, "0750", -o, deploy, -g, deploy, /opt/myinvest-support]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, "22/tcp"]
  - [ufw, allow, "80/tcp"]
  - [ufw, allow, "443/tcp"]
  - [ufw, allow, "443/udp"]
  - [ufw, --force, enable]
  - [systemctl, restart, ssh]

final_message: "myinvest-support host ready after $UPTIME seconds"
