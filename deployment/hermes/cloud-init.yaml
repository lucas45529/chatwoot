#cloud-config
# Dedicated Hermes runtime host (Ubuntu 24.04 LTS).

package_update: true
package_upgrade: true
package_reboot_if_required: false

groups:
  - docker

packages:
  - ca-certificates
  - curl
  - fail2ban
  - git
  - gnupg
  - jq
  - rsync
  - ufw
  - unattended-upgrades

users:
  - name: deploy
    groups: [docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - __SSH_PUBLIC_KEY__

apt:
  sources:
    docker:
      source: "deb [arch=amd64 signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable"
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
      keyserver: https://download.docker.com/linux/ubuntu/gpg

write_files:
  - path: /etc/ssh/sshd_config.d/90-myinvest-hermes-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
      AllowTcpForwarding local
      MaxAuthTries 4
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "50m", "max-file": "5" },
        "live-restore": true
      }
  - path: /etc/apt/apt.conf.d/52myinvest-unattended
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Automatic-Reboot "false";

swap:
  filename: /swapfile
  size: 8G
  maxsize: 8G

runcmd:
  - [apt-get, install, -y, docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
  - [systemctl, enable, --now, docker]
  - [systemctl, enable, --now, fail2ban]
  - [install, -d, -m, "0750", -o, deploy, -g, deploy, /opt/hermes-stack]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, "22/tcp"]
  - [ufw, --force, enable]
  - [systemctl, restart, ssh]

final_message: "myinvest-hermes host ready after $UPTIME seconds"
